[project]
name = "spotter-freight-rate-assessment"
version = "0.1.0"
description = "Reproducible freight-rate modeling assessment for Spotter"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "lightgbm (>=4.6,<5)",
    "scipy (>=1.10,<2)",
]

[project.scripts]
spotter-explore = "spotter_freight.explore:main"
spotter-train = "spotter_freight.train:main"
spotter-tune-lightgbm = "spotter_freight.tune_lightgbm:main"

[tool.poetry]
packages = [{ include = "spotter_freight", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
